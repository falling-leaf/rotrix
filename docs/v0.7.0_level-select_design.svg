<svg xmlns="http://www.w3.org/2000/svg" width="375" height="667" viewBox="0 0 375 667">
  <defs>
    <!-- Locked lock icon (bright yellow, 46×46 total bounding box) -->
    <g id="lock-locked">
      <!-- Lock ring shadow -->
      <rect x="-14" y="-23" width="28" height="22" rx="10" fill="#D7AF00" opacity="0.3" />
      <!-- Lock ring outer (30w × 22h) -->
      <rect x="-15" y="-24" width="30" height="22" rx="10" fill="#FFD30A" />
      <!-- Lock ring top highlight -->
      <rect x="-13" y="-26" width="26" height="4" rx="2" fill="#FFE44D" opacity="0.4" />
      <!-- Lock ring inner hole (22w × 18h) -->
      <rect x="-11" y="-22" width="22" height="18" rx="8" fill="#C900D7" />
      <!-- Lock body bottom shadow -->
      <rect x="-18" y="14" width="36" height="8" rx="4" fill="#D7AF00" opacity="0.4" />
      <!-- Lock body (38w × 26h) -->
      <rect x="-19" y="-4" width="38" height="26" rx="9" fill="#FFD30A" />
      <!-- Lock body subtle highlight -->
      <rect x="-17" y="-2" width="34" height="6" rx="3" fill="#FFE44D" opacity="0.15" />
      <!-- Keyhole - white circle -->
      <circle cx="0" cy="8" r="3.5" fill="white" />
      <!-- Keyhole - white vertical slot -->
      <rect x="-2" y="9" width="4" height="6" rx="2" fill="white" />
      <!-- Highlight dot left -->
      <circle cx="-12" cy="2" r="2" fill="white" />
      <!-- Highlight dot right -->
      <circle cx="12" cy="2" r="2" fill="white" />
    </g>

    <!-- Unlocked level indicator (46×46 rounded rect, lock body yellow #FFD30A, white border) -->
    <g id="level-unlocked">
      <!-- White border -->
      <rect x="-23" y="-23" width="46" height="46" rx="12" fill="#FFFFFF" />
      <!-- Yellow fill (same as lock body #FFD30A) -->
      <rect x="-21" y="-21" width="42" height="42" rx="10" fill="#FFD30A" />
    </g>
  </defs>

  <!-- ============================================ -->
  <!-- MAIN BACKGROUND (purple-pink rounded rect)     -->
  <!-- ============================================ -->
  <rect x="14" y="69" width="347" height="598" rx="30" fill="#DF4BEA" />

  <!-- ============================================ -->
  <!-- TITLE BANNER (straight side edges connect     -->
  <!-- with background side edges)                   -->
  <!-- ============================================ -->
  <!-- Layer 1: Dark purple outermost -->
  <rect x="14" y="49" width="347" height="90" rx="40" fill="#A900D0" />
  <!-- Layer 2: Magenta transition -->
  <rect x="19" y="54" width="337" height="80" rx="35" fill="#C70CDB" />
  <!-- Layer 3: White inner ring -->
  <rect x="23" y="58" width="329" height="72" rx="31" fill="#FFFFFF" />
  <!-- Layer 4: Inner bright purple fill (NO TEXT) -->
  <rect x="27" y="62" width="321" height="64" rx="27" fill="#E052ED" />

  <!-- ============================================ -->
  <!-- BACK BUTTON (rounded rect, h=33px, 1.5x)      -->
  <!-- ============================================ -->
  <!-- Outer white rounded rect -->
  <rect x="27" y="142" width="107" height="33" rx="10" fill="#FFFFFF" />
  <!-- Inner purple rounded rect -->
  <rect x="29" y="144" width="103" height="29" rx="8" fill="#DF4BEA" />
  <!-- Arrow shadow -->
  <path d="M 34 158.5 L 55 148 L 55 169 Z" fill="#A900D0" opacity="0.25" transform="translate(1, 1)" />
  <!-- Left arrow (triangle pointing left, scaled 1.5x) -->
  <path d="M 34 158.5 L 55 148 L 55 169 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />

  <!-- ============================================ -->
  <!-- LEVEL PANEL (moved down to y=178 for equal    -->
  <!-- spacing above and below)                      -->
  <!-- ============================================ -->
  <!-- Outer white border -->
  <rect x="27" y="178" width="321" height="430" rx="44" fill="#FFFFFF" />
  <!-- Inner dark purple fill -->
  <rect x="32" y="183" width="311" height="420" rx="39" fill="#C900D7" />

  <!-- ============================================ -->
  <!-- LOCK ICONS GRID (4 columns × 6 rows)          -->
  <!-- ============================================ -->
  <!-- Row 1: y=218 -->
  <use href="#level-unlocked" x="90" y="218" />
  <use href="#lock-locked" x="155" y="218" />
  <use href="#lock-locked" x="220" y="218" />
  <use href="#lock-locked" x="285" y="218" />

  <!-- Row 2: y=288 -->
  <use href="#lock-locked" x="90" y="288" />
  <use href="#lock-locked" x="155" y="288" />
  <use href="#lock-locked" x="220" y="288" />
  <use href="#lock-locked" x="285" y="288" />

  <!-- Row 3: y=358 -->
  <use href="#lock-locked" x="90" y="358" />
  <use href="#lock-locked" x="155" y="358" />
  <use href="#lock-locked" x="220" y="358" />
  <use href="#lock-locked" x="285" y="358" />

  <!-- Row 4: y=428 -->
  <use href="#lock-locked" x="90" y="428" />
  <use href="#lock-locked" x="155" y="428" />
  <use href="#lock-locked" x="220" y="428" />
  <use href="#lock-locked" x="285" y="428" />

  <!-- Row 5: y=498 -->
  <use href="#lock-locked" x="90" y="498" />
  <use href="#lock-locked" x="155" y="498" />
  <use href="#lock-locked" x="220" y="498" />
  <use href="#lock-locked" x="285" y="498" />

  <!-- Row 6: y=568 -->
  <use href="#lock-locked" x="90" y="568" />
  <use href="#lock-locked" x="155" y="568" />
  <use href="#lock-locked" x="220" y="568" />
  <use href="#lock-locked" x="285" y="568" />

  <!-- ============================================ -->
  <!-- BOTTOM NAVIGATION BUTTONS (54×54 square,      -->
  <!-- matching back button style, equal spacing)    -->
  <!-- ============================================ -->
  <!-- Left button: left arrow (right edge aligns with 2nd lock right edge=178) -->
  <rect x="124" y="610.5" width="54" height="54" rx="12" fill="#FFFFFF" />
  <rect x="128" y="614.5" width="46" height="46" rx="10" fill="#DF4BEA" />
  <path d="M 141 637.5 L 162 627 L 162 648 Z" fill="#A900D0" opacity="0.25" transform="translate(0.5, 0.5)" />
  <path d="M 141 637.5 L 162 627 L 162 648 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Right button: right arrow (left edge aligns with 3rd lock left edge=197) -->
  <rect x="197" y="610.5" width="54" height="54" rx="12" fill="#FFFFFF" />
  <rect x="201" y="614.5" width="46" height="46" rx="10" fill="#DF4BEA" />
  <path d="M 234 637.5 L 213 627 L 213 648 Z" fill="#A900D0" opacity="0.25" transform="translate(-0.5, 0.5)" />
  <path d="M 234 637.5 L 213 627 L 213 648 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" />
</svg>